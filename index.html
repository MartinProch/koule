<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koule Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#fbfaf7; --ink:#15151a; --muted:#7c7b84; --line:#e4e1d9; --line2:#bdb9ae; --soft:#f1eee7;
    --card:#ffffff; --text2:#4b4a52; --tgoff:#d9d6cd;
    --accent:#ff4a1c; --r:10px;
    --display:"Bricolage Grotesque", "Helvetica Neue", sans-serif;
    --mono:"DM Mono", ui-monospace, Menlo, monospace;
    color-scheme:light;
  }
  /* tmavý panel — zapíná se sám, když je pozadí scény tmavé */
  :root[data-theme="dark"] {
    --paper:#141418; --ink:#f3f1ec; --muted:#8a8993; --line:#2b2b32; --line2:#4a4a54; --soft:#1f1f25;
    --card:#1c1c22; --text2:#bdbcc4; --tgoff:#3a3a43;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink); font:13px/1.35 var(--display); background:var(--paper); }
  .app { display:grid; grid-template-columns:1fr 340px; height:100%; }
  .stage { position:relative; min-width:0; transition:background .35s; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas.grabbing { cursor:grabbing; }
  .hint { position:absolute; left:0; right:0; bottom:18px; text-align:center; font:11px var(--mono); letter-spacing:.04em; color:rgba(120,120,130,.9); pointer-events:none; }
  .badge { position:absolute; left:22px; top:20px; font:800 15px var(--display); letter-spacing:-.01em; mix-blend-mode:difference; color:#fff; pointer-events:none; }
  .badge small { font:400 11px var(--mono); opacity:.7; margin-left:8px; letter-spacing:.04em; }

  .panel { background:var(--paper); color:var(--ink); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; transition:background .35s, color .35s, border-color .35s; }
  .head { padding:14px 20px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  .head h1 { margin:0; font:800 24px/1 var(--display); letter-spacing:-.03em; }
  .head .seg { flex:1; }
  .head h1 span { color:var(--accent); }
  .scroll { overflow-y:auto; flex:1; padding:4px 20px 12px; scrollbar-width:thin; }
  details { border-bottom:1px solid var(--line); padding:10px 0 12px; }
  summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    font:500 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"+"; font-size:15px; }
  details[open] > summary::after { content:"–"; }
  details[open] > summary { margin-bottom:10px; color:var(--ink); }
  summary:hover { color:var(--ink); }

  /* řádek = popisek vlevo, ovládání vpravo */
  .row { margin-top:8px; display:grid; grid-template-columns:92px 1fr; column-gap:10px; align-items:start; }
  .row.full { grid-template-columns:1fr; }
  .row.stack { grid-template-columns:1fr; row-gap:5px; }   /* čipy a barvy: popisek nad, ať se vejdou na řádek */
  .row.stack .lbl { padding-top:0; }
  .row.sl { grid-template-columns:92px 1fr 34px; align-items:center; }
  details > .row:first-of-type, details > .tgs:first-of-type { margin-top:0; }
  .lbl { font-size:12px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-top:5px; }
  .row.sl .lbl { padding-top:0; }
  .row.sl b { font:400 11px var(--mono); color:var(--muted); text-align:right; }

  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:4px 8px; font:12px/1.35 var(--display); cursor:pointer; transition:.12s; }
  .chip:hover { border-color:var(--line2); }
  .chip.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:3px; background:var(--soft); border-radius:var(--r); }
  .seg button { border:0; background:none; padding:6px 0; border-radius:8px; font:600 12px var(--display); cursor:pointer; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14); }

  .sw { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .sw button { width:20px; height:20px; border-radius:50%; border:2px solid var(--paper); box-shadow:0 0 0 1px var(--line2); cursor:pointer; padding:0; }
  .sw button.on { box-shadow:0 0 0 2px var(--ink); }
  .sw input[type=color] { width:20px; height:20px; padding:0; border:0; background:none; border-radius:50%; cursor:pointer; }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:18px; background:none; margin:0; }
  input[type=range]::-webkit-slider-runnable-track { height:3px; border-radius:2px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; margin-top:-6.5px; border-radius:50%; background:var(--ink); border:3px solid var(--paper); box-shadow:0 0 0 1px var(--ink); }

  /* přepínače ve dvou sloupcích */
  .tgs { display:grid; grid-template-columns:1fr 1fr; gap:7px 16px; margin-top:8px; }
  .tg { display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; font-size:12px; min-width:0; }
  .tg span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tgs > .tg:only-child { grid-column:1 / -1; }
  .tg input { display:none; }
  .tg i { width:28px; height:16px; border-radius:16px; background:var(--tgoff); position:relative; transition:.15s; flex:none; }
  .tg i::after { content:""; position:absolute; left:2px; top:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .tg input:checked + i { background:var(--accent); }
  .tg input:checked + i::after { transform:translateX(12px); }

  /* volby, které dávají smysl jen při zapnuté nadřazené volbě */
  .dep { margin-left:2px; padding-left:10px; border-left:2px solid var(--line); animation:rise .28s cubic-bezier(.2,.8,.2,1) both; }
  .tgs > .dep { margin-left:0; padding-left:0; border-left:0; }
  .dep.hide { display:none; }
  @keyframes rise { from { opacity:0; transform:translateY(-5px); } }

  input[type=range]::-moz-range-track { height:3px; border-radius:2px; background:var(--line); }
  input[type=range]::-moz-range-thumb { width:10px; height:10px; border-radius:50%; background:var(--ink); border:3px solid var(--paper); box-shadow:0 0 0 1px var(--ink); }
  kbd { font:500 10px var(--mono); padding:1px 5px; border:1px solid currentColor; border-radius:4px; opacity:.75; }
  .foot button kbd { margin-left:5px; border-color:currentColor; opacity:.55; }

  .foot { padding:10px 20px 14px; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .foot button { padding:8px 0; border-radius:var(--r); border:1px solid var(--line); background:var(--card); color:var(--ink); font:600 12px var(--display); cursor:pointer; }
  .foot button.main { background:var(--accent); color:#fff; border-color:var(--accent); }
  .foot button:hover { filter:brightness(.96); }
  /* kreslení vlastního tvaru: průsvitná plocha přes scénu */
  .draw { position:absolute; inset:0; z-index:5; background:rgba(251,250,247,.62); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); animation:rise .25s ease both; }
  :root[data-theme="dark"] .draw { background:rgba(20,20,24,.62); }
  .draw[hidden] { display:none; }
  .draw canvas { cursor:crosshair; }
  .draw-ui { position:absolute; left:0; right:0; top:18px; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none; text-align:center; padding:0 16px; }
  .draw-ui p { margin:0; font:700 18px/1.2 var(--display); letter-spacing:-.01em; color:var(--ink); }
  .draw-ui small { font:11px var(--mono); color:var(--muted); letter-spacing:.03em; }
  .draw-ui small.bad { color:var(--accent); }
  .draw-bar { position:absolute; left:0; right:0; bottom:18px; display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding:0 12px; }
  .draw-bar button { border:1px solid var(--line2); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 13px; font:600 12px var(--display); cursor:pointer; }
  .draw-bar button.main { background:var(--accent); border-color:var(--accent); color:#fff; }
  .draw-bar button.on { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .draw-bar button:disabled { opacity:.4; cursor:default; }
  .chip.pen { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.pen:hover { filter:brightness(.95); }
  #err { position:absolute; inset:0; display:none; place-items:center; text-align:center; padding:30px; color:var(--muted); }

  .foot button { white-space:nowrap; }
  @media (max-width:1100px), (pointer:coarse) { .hint .keys { display:none; } }
  @media (max-width:820px), (pointer:coarse) { .foot kbd { display:none; } }
  @media (max-width:820px) {
    .app { grid-template-columns:1fr; grid-template-rows:55% 45%; }
    .panel { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="badge">Koule Studio<small>WebGL</small></div>
    <div class="hint" id="hint"></div>
    <div class="draw" id="draw" hidden>
      <canvas id="dc"></canvas>
      <div class="draw-ui">
        <p>Nakresli obrys</p>
        <small id="dMsg">kresli tažením, klidně víc tahy · nebo klikej body, spojí se čarou · pak Hotovo</small>
      </div>
      <div class="draw-bar">
        <button id="dUndo" title="Vrátit poslední tah (Z)">↶ Zpět</button>
        <button id="dClear">Smazat</button>
        <button id="dFace" title="Klikni do kresby, kam má přijít obličej">☺ Obličej sem</button>
        <button id="dCancel" title="Esc">Zrušit</button>
        <button id="dDone" class="main" title="Enter">Hotovo ✓</button>
      </div>
    </div>
    <div id="err">Nepodařilo se načíst WebGL nebo knihovnu three.js (potřebuje internet).</div>
  </div>
  <aside class="panel">
    <div class="head">
      <h1>Koule<span>.</span></h1>
      <div class="seg"><button id="mRot" class="on" title="Mezerník přepíná režim">Otáčet</button><button id="mPull" title="Mezerník přepíná režim">Natahovat</button></div>
    </div>
    <div class="scroll" id="ui"></div>
    <div class="foot">
      <button id="bRand" class="main" title="Náhodná postavička (R)">Náhoda<kbd>R</kbd></button>
      <button id="bReset" title="Vrátit výchozí nastavení">Obnovit</button>
      <button id="bPng" title="Uložit obrázek (S)">Uložit PNG<kbd>S</kbd></button>
    </div>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   STAV A VÝCHOZÍ HODNOTY
   ===================================================================== */
const DEFAULTS = {
  mode:'rotate',
  shape:'koule',
  color:'#0a0a0c', grad:false, gradColor:'#ff4a1c', gradAngle:0, gradMid:0, gradSoft:0.6, pattern:0, color2:'#ffffff', patScale:6,
  finish:'plast', highlights:false,
  face:true, eyes:2, eyeStyle:0, eyeSize:0.075, spread:0.26, eyeY:0.14,
  brows:false, browAng:0.3,
  mouth:1, mouthS:0.17, mouthY:-0.2,
  faceX:0, faceY:0, cheeks:false, faceColor:'#ffffff', glow:false,
  track:true, blink:true, breathe:true, bounce:false, sway:false, spin:false,
  soft:0.7, sound:true, deco:true, puff:1.8,
  bg:'#f3f1ec', shadow:true, sx:1, sy:1, sz:1,
};
const S = { ...DEFAULTS };

/* =====================================================================
   TVARY — každý je funkce: směr na jednotkové kouli -> bod na povrchu.
   ===================================================================== */
const norm3 = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };

const ICO = (() => {
  const p = (1 + Math.sqrt(5)) / 2, v = [];
  for (const a of [-1, 1]) for (const b of [-p, p]) { v.push([0, a, b], [a, b, 0], [b, 0, a]); }
  return v.map(norm3);
})();

const HEART = (() => {          // tabulka poloměru srdce podle úhlu (křivka 16sin³t…)
  const B = 720, tab = new Float32Array(B), cy = 2;
  for (let k = 0; k < 60000; k++) {
    const t = k / 60000 * Math.PI * 2;
    const X = 16 * Math.sin(t) ** 3;
    const Y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    let a = Math.atan2(Y - cy, X); if (a < 0) a += Math.PI * 2;
    const b = Math.floor(a / (Math.PI * 2) * B) % B;
    tab[b] = Math.max(tab[b], Math.hypot(X, Y - cy));
  }
  for (let i = 0; i < B; i++) if (!tab[i]) tab[i] = tab[(i + B - 1) % B];
  return (phi) => {
    let a = phi < 0 ? phi + Math.PI * 2 : phi;
    const f = a / (Math.PI * 2) * B, i = Math.floor(f) % B, t = f - Math.floor(f);
    return (tab[i] * (1 - t) + tab[(i + 1) % B] * t) / 18;
  };
})();

/* ----- zvířátka: hlava + uši (+ čumák). Pro každý směr bereme nejvzdálenější průsečík
   paprsku z počátku se sjednocením těles (hladce, přes smax). Vrací i štítky oblastí
   [ucho, vnitřek ucha, čumák], podle kterých shader barví. ----- */
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross3 = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const smax = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h*h*k*0.25; };
const sstep = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t*t*(3 - 2*t); };
const headR = (x, y, z, s) => 1 / Math.hypot(x/s[0], y/s[1], z/s[2]);
// elipsoid: střed c, hlavní osa axis, poloměry [do strany, podél osy, dopředu]
function ellipsoid(c, axis, r, fwd = [0, 0, 1]) {
  const v = norm3(axis), u = norm3(cross3(fwd, v)), w = cross3(v, u);
  return { c, ax:[u, v, w], r };
}
// nejvzdálenější průsečík paprsku t·d s elipsoidem (0 = mine)
function hitFar(d, e) {
  let a = 0, b = 0, cc = -1;
  for (let k = 0; k < 3; k++) { const dl = dot3(d, e.ax[k]) / e.r[k], cl = dot3(e.c, e.ax[k]) / e.r[k]; a += dl*dl; b += dl*cl; cc += cl*cl; }
  const disc = b*b - a*cc; return disc > 0 ? (b + Math.sqrt(disc)) / a : 0;
}
// souřadnice bodu p v jednotkové soustavě elipsoidu (složka 2 = jak moc míří dopředu)
const ellLocal = (p, e) => [0, 1, 2].map(k => dot3([p[0]-e.c[0], p[1]-e.c[1], p[2]-e.c[2]], e.ax[k]) / e.r[k]);

const CAT = (() => { const v = norm3([0.5, 0.86, 0.06]), u = norm3(cross3([0, 0, 1], v)); return { v, u, w:cross3(v, u) }; })();
function cat(x, y, z) {
  const d = [Math.abs(x), y, z], h = headR(x, y, z, [1.1, 0.94, 0.96]);
  let ear = 0, inner = 0; const dv = dot3(d, CAT.v);
  if (dv > 0.3) {
    const du = dot3(d, CAT.u), dw = dot3(d, CAT.w);
    const rho = Math.hypot(du, dw * 2.6) / dv;                    // „úhel“ od osy ucha, ucho je zploštělé
    ear = 1.62 * (1 - Math.sqrt(rho*rho + 0.004) / 0.95);           // kužel se zakulacenou špičkou
    inner = sstep(0.0, 0.04, dw) * sstep(0.34, 0.2, Math.abs(du) / dv) * sstep(1.0, 1.18, ear / h);   // užší růžový střed, okraj zůstane v barvě
  }
  const r = smax(h, ear, 0.12);
  return [x*r, y*r, z*r, 0, inner, 0];
}

const BEAR_EAR = ellipsoid(norm3([0.6, 0.76, 0.02]).map(c => c * 0.98), [0.6, 0.76, 0.02], [0.33, 0.27, 0.2]);
const BEAR_SNOUT = ellipsoid([0, -0.27, 0.68], [0, 0, 1], [0.36, 0.38, 0.27], [0, 1, 0]);
function bear(x, y, z) {
  const d = [Math.abs(x), y, z], h = headR(x, y, z, [1.06, 0.97, 1]);
  const e = hitFar(d, BEAR_EAR), s = hitFar(d, BEAR_SNOUT);
  const r = smax(smax(h, e, 0.1), s, 0.14);
  const isEar = sstep(-0.02, 0.03, e - h), isSnout = sstep(-0.03, 0.03, s - Math.max(h, e));
  const inner = isEar * sstep(0.3, 0.6, ellLocal([d[0]*r, d[1]*r, d[2]*r], BEAR_EAR)[2]);
  return [x*r, y*r, z*r, 0, inner, isSnout];
}

// psí ucho = plochý lalok přiléhající k hlavě a visící dolů (radiální „boule“ → vždy bez trhlin)
const DOG_EAR = (() => {
  const a = norm3([0.8, 0.12, 0.34]), v0 = [0.3, -1, 0.05];
  const k = dot3(v0, a), v = norm3([v0[0] - k*a[0], v0[1] - k*a[1], v0[2] - k*a[2]]);
  return { a, v, u:cross3(a, v) };
})();
const DOG_SNOUT = ellipsoid([0, -0.25, 0.7], [0, 0, 1], [0.34, 0.46, 0.27], [0, 1, 0]);
function dog(x, y, z) {
  const d = [Math.abs(x), y, z], h = headR(x, y, z, [1, 1, 1.02]), s = hitFar(d, DOG_SNOUT);
  let ear = 0;
  if (dot3(d, DOG_EAR.a) > 0) {
    const along = dot3(d, DOG_EAR.v) - 0.12, side = dot3(d, DOG_EAR.u);
    const wid = 0.2 + 0.09 * Math.max(0, along / 0.46);                // dole širší → tvar kapky
    ear = Math.exp(-(Math.abs(along / 0.46) ** 3) - (Math.abs(side / wid) ** 3));   // plochý lalok s oblým okrajem
  }
  const r = smax(h + 0.13 * ear, s, 0.14);
  return [x*r, y*r, z*r, sstep(0.25, 0.6, ear), 0, sstep(-0.03, 0.03, s - h)];
}

const SHAPES = {
  koule:   { label:'Koule',   f:(x,y,z) => [x, y, z] },
  vejce:   { label:'Vejce',   f:(x,y,z) => { const k = 0.92 - 0.17*y; return [x*k, y*1.2, z*k]; } },
  kostka:  { label:'Kostka',  f:(x,y,z) => { const s = Math.pow(Math.abs(x)**5 + Math.abs(y)**5 + Math.abs(z)**5, 0.2); const k = 0.82/s; return [x*k, y*k, z*k]; } },
  pilulka: { label:'Pilulka', f:(x,y,z) => {
    const r = 0.68, h = 0.55, l0 = 0.4, lat = Math.asin(Math.max(-1, Math.min(1, y)));
    const rho = Math.hypot(x, z) || 1e-6; let yy, rad;
    if (Math.abs(lat) < l0) { yy = h * lat / l0; rad = r; }
    else { const ph = (Math.abs(lat) - l0) / (Math.PI/2 - l0) * Math.PI/2; yy = Math.sign(lat) * (h + r*Math.sin(ph)); rad = r*Math.cos(ph); }
    return [x/rho*rad, yy, z/rho*rad];
  } },
  kapka:   { label:'Kapka',   f:(x,y,z) => { const s = Math.max(y, 0); const k = 1 - 0.55*s; return [x*k, y*(1 + 0.85*s) - 0.12, z*k]; } },
  srdce:   { label:'Srdce',   f:(x,y,z) => { const R = HEART(Math.atan2(y, x)); return [x*R, y*R + 0.13, z*0.55]; } },
  hvezda:  { label:'Hvězda',  f:(x,y,z) => { const phi = Math.atan2(y, x); const lobe = Math.pow(0.5 + 0.5*Math.cos(5*(phi - Math.PI/2)), 1.3); const R = 0.45 + 0.7*lobe; return [x*R, y*R, z*0.5]; } },

/* ----- uniformy sdílené s shadery ----- */
const U = {
  uGrab:{ value:new THREE.Vector3() }, uOff:{ value:new THREE.Vector3() }, uSigma:{ value:0.7 }, uMorph:{ value:0 },
  uGrad:{ value:0 }, uGradColor:{ value:new THREE.Color() }, uGradAngle:{ value:0 }, uGradMid:{ value:0 }, uGradSoft:{ value:0.6 }, uPattern:{ value:0 }, uColor2:{ value:new THREE.Color() }, uPatScale:{ value:6 },
  uFace:{ value:new THREE.Color() }, uPupil:{ value:new THREE.Color() }, uCheek:{ value:new THREE.Color('#ff7f93') },
  uEyes:{ value:Array.from({ length:8 }, () => new THREE.Vector2()) }, uEyeN:{ value:2 },
  uEyeR:{ value:0.075 }, uEyeStyle:{ value:0 }, uBlink:{ value:0 }, uLook:{ value:new THREE.Vector2() },
  uMouthStyle:{ value:1 }, uMouthS:{ value:0.17 }, uMouthY:{ value:-0.2 },
  uBrows:{ value:0 }, uBrowAng:{ value:0.3 }, uCheeks:{ value:0 }, uCheekX:{ value:0.4 },
  uHL:{ value:0 }, uGlow:{ value:0 }, uFaceOn:{ value:1 }, uFaceRot:{ value:new THREE.Matrix3() },
  uAnimal:{ value:0 }, uTagMix:{ value:new THREE.Vector3() }, uEarCol:{ value:new THREE.Color() }, uInnerCol:{ value:new THREE.Color() },
  uMuzzleCol:{ value:new THREE.Color() }, uNoseCol:{ value:new THREE.Color() },

const VERT_COMMON = `
  attribute vec3 aPosB; attribute vec3 aNormB; attribute vec3 aDir; attribute vec3 aTagA; attribute vec3 aTagB;
  uniform vec3 uGrab; uniform vec3 uOff; uniform float uSigma; uniform float uMorph;
  varying vec3 vDir; varying vec3 vTag;`;
const VERT_NORMAL = `
  vec3 mp = mix(position, aPosB, uMorph);
  vec3 mn = normalize(mix(normal, aNormB, uMorph));
  vec3 gd = mp - uGrab;
  float gw = exp(-dot(gd, gd) / (2.0 * uSigma * uSigma));
  vec3 gb = -gw * gd / (uSigma * uSigma);
  vec3 objectNormal = normalize(mn - gb * dot(uOff, mn) / max(0.25, 1.0 + dot(gb, uOff)));
  vDir = aDir; vTag = mix(aTagA, aTagB, uMorph);`;
const VERT_BEGIN = `vec3 transformed = mp + uOff * gw;`;

const FRAG_COMMON = `
  uniform float uGrad; uniform vec3 uGradColor; uniform float uGradAngle; uniform float uGradMid; uniform float uGradSoft;
  uniform float uPattern; uniform vec3 uColor2; uniform float uPatScale;
  uniform vec3 uFace; uniform vec3 uPupil; uniform vec3 uCheek;
  uniform vec2 uEyes[8]; uniform int uEyeN; uniform float uEyeR; uniform float uEyeStyle; uniform float uBlink; uniform vec2 uLook;
  uniform float uMouthStyle; uniform float uMouthS; uniform float uMouthY;
  uniform float uBrows; uniform float uBrowAng; uniform float uCheeks; uniform float uCheekX;
  uniform float uHL; uniform float uGlow; uniform float uFaceOn; uniform mat3 uFaceRot;
  uniform float uAnimal; uniform vec3 uTagMix; uniform vec3 uEarCol; uniform vec3 uInnerCol; uniform vec3 uMuzzleCol; uniform vec3 uNoseCol;
  varying vec3 vDir; varying vec3 vTag;
  float gAA;
  float fillm(float d) { return 1.0 - smoothstep(-gAA, gAA, d); }
  float sdSeg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
  float sdArc(vec2 p, vec2 sc, float ra, float rb) { p.x = abs(p.x); return ((sc.y * p.x > sc.x * p.y) ? length(p - sc * ra) : abs(length(p) - ra)) - rb; }
  float sdTri(vec2 p, float r) {   // rovnostranný trojúhelník špičkou dolů
    const float k = 1.7320508; p.y = -p.y; p.x = abs(p.x) - r; p.y = p.y + r / k;
    if (p.x + k * p.y > 0.0) p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0;
    p.x -= clamp(p.x, -2.0 * r, 0.0); return -length(p) * sign(p.y);
  }`;

const FRAG_MAIN = `
  vec3 gGlowCol = vec3(0.0);
  {
    vec3 dir = normalize(vDir);
    vec3 base = diffuseColor.rgb;

    // --- vzor na těle ---
    if (uPattern > 0.5) {
      float m = 0.0;
      if (uPattern < 1.5) {
        float v = sin(dir.y * uPatScale * 3.14159); float w = fwidth(v) + 0.001;
        m = smoothstep(-w, w, v);
      } else if (uPattern < 2.5) {
        vec3 p = dir * uPatScale * 0.8; vec3 c = floor(p) + 0.5; float dd = length(p - c) - 0.28; float w = fwidth(dd) + 0.001;
        m = 1.0 - smoothstep(-w, w, dd);
      } else if (uPattern < 3.5) {
        vec3 p = dir * uPatScale * 0.5; float v = sin(p.x * 3.14159) * sin(p.y * 3.14159) * sin(p.z * 3.14159); float w = fwidth(v) + 0.001;
        m = smoothstep(-w, w, v);
      } else { m = dir.y * 0.5 + 0.5; }
      base = mix(base, uColor2, m);
    }
    if (uGrad > 0.5) {
      float t = dot(dir, vec3(sin(uGradAngle), cos(uGradAngle), 0.0));
      base = mix(base, uGradColor, smoothstep(uGradMid - uGradSoft, uGradMid + uGradSoft, t));
    }
    // zvířecí oblasti z geometrie: tmavší uši, růžová ouška, světlý čumák
    base = mix(base, uEarCol,    smoothstep(0.15, 0.85, vTag.x) * uTagMix.x);
    base = mix(base, uInnerCol,  smoothstep(0.35, 0.65, vTag.y) * uTagMix.y);
    base = mix(base, uMuzzleCol, smoothstep(0.35, 0.65, vTag.z) * uTagMix.z);
    vec3 col = base;

    // --- obličej ---
    vec3 fd = uFaceRot * dir;
    vec2 q = fd.xy;
    gAA = (fwidth(q.x) + fwidth(q.y)) * 0.6 + 0.0005;
    float front = smoothstep(0.02, 0.2, fd.z) * uFaceOn;
    float R = uEyeR;

    float cheekM = 0.0;
    if (uCheeks > 0.5) {
      for (int s = 0; s < 2; s++) {
        float sg = (s == 0) ? -1.0 : 1.0;
        vec2 c = vec2(sg * uCheekX, uMouthY + 0.06);
        cheekM = max(cheekM, (1.0 - smoothstep(0.0, 0.1, length((q - c) * vec2(1.0, 1.5)) - 0.05)) * 0.6);
      }
    }

    float eyeM = 0.0, pupM = 0.0, browM = 0.0, dAll = 1e5;
    float by = max(0.06, 1.0 - uBlink);
    for (int i = 0; i < 8; i++) {
      if (i < uEyeN) {
        vec2 e = uEyes[i];
        vec2 p = q - e;
        float d;
        if (uEyeStyle < 0.5) { p.y /= by; d = length(p) - R; }
        else if (uEyeStyle < 1.5) { p.y /= by; d = length(vec2(p.x, p.y - clamp(p.y, -R, R))) - R * 0.55; }
        else if (uEyeStyle < 2.5) {
          p.y /= by; d = length(p) - R * 1.35;
          pupM = max(pupM, fillm(length(p - uLook * R * 0.5) - R * 0.7));
        }
        else if (uEyeStyle < 3.5) { d = sdArc(p - vec2(0.0, -R * 0.35), vec2(sin(1.05), cos(1.05)), R * 1.2, R * 0.24); }
        else { d = sdSeg(p, vec2(-R * 1.1, 0.0), vec2(R * 1.1, 0.0)) - R * 0.24; }
        eyeM = max(eyeM, fillm(d)); dAll = min(dAll, d);
        if (uBrows > 0.5) {
          float sgn = e.x > 0.001 ? 1.0 : (e.x < -0.001 ? -1.0 : 0.0);
          float a = uBrowAng * sgn; vec2 u = vec2(cos(a), sin(a));
          vec2 c = e + vec2(0.0, R * 2.1); float hl = R * 1.15;
          float bd = sdSeg(q, c - u * hl, c + u * hl) - R * 0.22;
          browM = max(browM, fillm(bd)); dAll = min(dAll, bd);
        }
      }
    }

    // --- ústa ---
    float S2 = uMouthS; vec2 m = q - vec2(0.0, uMouthY);
    float md = 1e5, tongueM = 0.0;
    int ms = int(uMouthStyle + 0.5);
    if (ms == 1) { md = sdArc(vec2(m.x, -(m.y - S2 * 0.7)), vec2(sin(1.0), cos(1.0)), S2, S2 * 0.16); }
    else if (ms == 2) {
      vec2 p = m - vec2(0.0, S2 * 0.35);
      md = max(length(p) - S2, p.y);
      tongueM = fillm(length(p - vec2(0.0, -S2 * 0.8)) - S2 * 0.42);
    }
    else if (ms == 3) { md = sdArc(vec2(m.x, m.y + S2 * 0.7), vec2(sin(1.0), cos(1.0)), S2, S2 * 0.16); }
    else if (ms == 4) { md = abs(length(m / vec2(0.75, 1.0)) - S2 * 0.55) - S2 * 0.16; }
    else if (ms == 5) { md = sdSeg(m, vec2(-S2 * 0.8, 0.0), vec2(S2 * 0.8, 0.0)) - S2 * 0.14; }
    else if (ms == 6) { md = sdArc(vec2(abs(m.x) - S2 * 0.5, -(m.y - S2 * 0.3)), vec2(sin(1.4), cos(1.4)), S2 * 0.5, S2 * 0.12); }
    else if (ms == 7) {
      md = sdArc(vec2(m.x, -(m.y - S2 * 0.7)), vec2(sin(1.0), cos(1.0)), S2, S2 * 0.16);
      vec2 tp = m - vec2(S2 * 0.38, -S2 * 0.82);
      float td = length(vec2(tp.x, max(tp.y, 0.0) )) - S2 * 0.3; td = max(td, -(tp.y + S2 * 0.05) * -1.0);
      tongueM = fillm(max(length(tp * vec2(1.0, 0.8)) - S2 * 0.32, tp.y - S2 * 0.12));
    }
    float mouthM = fillm(md); dAll = min(dAll, md);

    // --- čumáček a vousky zvířátek ---
    float noseM = 0.0, whiskM = 0.0;
    int an = int(uAnimal + 0.5);
    if (an > 0) {
      vec2 np = q - vec2(0.0, uMouthY + (an == 1 ? 0.075 : 0.12));
      if (an == 1) noseM = fillm(sdTri(np, 0.034) - 0.014);
      else if (an == 2) noseM = fillm(length(np / vec2(1.0, 0.7)) - 0.062);
      else noseM = fillm(sdTri(np, 0.045) - 0.02);
      if (an == 1) {
        for (int i = 0; i < 3; i++) {
          float o = float(i - 1);
          vec2 w = vec2(abs(q.x), q.y - uMouthY - 0.05);
          float wd = sdSeg(w, vec2(0.13, o * 0.025), vec2(0.4, o * 0.085 + 0.01)) - 0.006;
          whiskM = max(whiskM, fillm(wd)); dAll = min(dAll, wd);
        }
      }
    }

    col = mix(col, uCheek, cheekM * front);
    col = mix(col, uPupil, fillm(dAll - 0.014) * front * step(0.5, uPattern));   // kontrastní obrys jen když je zvolen vzor
    col = mix(col, uFace, max(browM, eyeM) * front);
    col = mix(col, uPupil, pupM * eyeM * front);
    col = mix(col, an >= 2 ? uNoseCol : uFace, mouthM * front);   // na světlém čumáku psa a medvídka tmavá pusa
    col = mix(col, uFace, whiskM * front);
    col = mix(col, uNoseCol, noseM * front);
    col = mix(col, uCheek * 0.9 + vec3(0.05), tongueM * (ms == 2 ? mouthM : 1.0) * front);
    float feat = max(max(browM, eyeM), mouthM) * front;

    // --- odlesky z předlohy ---
    float hl = 0.0;
    if (uHL > 0.5) {
      vec2 hp = dir.xy;
      float d1 = sdSeg(hp, vec2(0.130, 0.533), vec2(0.273, 0.272)) - 0.07;
      float d2 = sdSeg(hp, vec2(0.562, 0.614), vec2(0.694, 0.353)) - 0.06;
      hl = max(fillm(d1), fillm(d2)) * smoothstep(0.0, 0.1, dir.z);
    }
    col = mix(col, vec3(1.0), hl);
    gGlowCol = vec3(hl) + uFace * feat * uGlow * 0.9;
    diffuseColor.rgb = col;
  }`;

const material = new THREE.MeshPhysicalMaterial({ color:0x0a0a0c, roughness:0.22, clearcoat:1, clearcoatRoughness:0.04, envMapIntensity:1.1 });
material.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\n' + VERT_COMMON)
    .replace('#include <beginnormal_vertex>', VERT_NORMAL)
    .replace('#include <begin_vertex>', VERT_BEGIN);
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\n' + FRAG_COMMON)
    .replace('#include <color_fragment>', '#include <color_fragment>\n' + FRAG_MAIN)
    .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += gGlowCol;');
};
material.customProgramCacheKey = () => 'koule-v2';

/* ----- geometrie + morfování tvarů ----- */
const geo = new THREE.SphereGeometry(1, 160, 112);
const NV = geo.attributes.position.count;
const dirs = Float32Array.from(geo.attributes.position.array);
geo.setAttribute('aDir', new THREE.BufferAttribute(dirs, 3));
const attrA = new THREE.BufferAttribute(new Float32Array(NV * 3), 3);
const attrNA = new THREE.BufferAttribute(new Float32Array(NV * 3), 3);
const attrB = new THREE.BufferAttribute(new Float32Array(NV * 3), 3);
const attrNB = new THREE.BufferAttribute(new Float32Array(NV * 3), 3);
const attrTA = new THREE.BufferAttribute(new Float32Array(NV * 3), 3);   // štítky oblastí (ucho, vnitřek ucha, čumák)
const attrTB = new THREE.BufferAttribute(new Float32Array(NV * 3), 3);
for (const a of [attrA, attrNA, attrB, attrNB, attrTA, attrTB]) a.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('aTagA', attrTA); geo.setAttribute('aTagB', attrTB);
geo.setAttribute('position', attrA); geo.setAttribute('normal', attrNA);
geo.setAttribute('aPosB', attrB); geo.setAttribute('aNormB', attrNB);

function buildShape(fn) {
  const pos = new Float32Array(NV * 3), nor = new Float32Array(NV * 3), tag = new Float32Array(NV * 3);
  let minY = 1e9; const e = 0.004;
  for (let i = 0; i < NV; i++) {
    const x = dirs[i*3], y = dirs[i*3+1], z = dirs[i*3+2];
    const c = fn(x, y, z);
    const ax = Math.abs(y) < 0.99 ? [0, 1, 0] : [1, 0, 0];
    let t1 = norm3([y*ax[2] - z*ax[1], z*ax[0] - x*ax[2], x*ax[1] - y*ax[0]]);
    const t2 = [y*t1[2] - z*t1[1], z*t1[0] - x*t1[2], x*t1[1] - y*t1[0]];
    const pa = fn(...norm3([x + e*t1[0], y + e*t1[1], z + e*t1[2]]));
    const pb = fn(...norm3([x + e*t2[0], y + e*t2[1], z + e*t2[2]]));
    const u = [pa[0]-c[0], pa[1]-c[1], pa[2]-c[2]], v = [pb[0]-c[0], pb[1]-c[1], pb[2]-c[2]];
    let n = [u[1]*v[2] - u[2]*v[1], u[2]*v[0] - u[0]*v[2], u[0]*v[1] - u[1]*v[0]];
    if (Math.hypot(...n) < 1e-12) n = [x, y, z];
    n = norm3(n);
    if (n[0]*x + n[1]*y + n[2]*z < 0) n = [-n[0], -n[1], -n[2]];
    pos[i*3] = c[0]; pos[i*3+1] = c[1]; pos[i*3+2] = c[2]; nor.set(n, i*3);
    tag[i*3] = c[3] || 0; tag[i*3+1] = c[4] || 0; tag[i*3+2] = c[5] || 0;
    if (c[1] < minY) minY = c[1];
  }
  return { pos, nor, tag, minY };
}

let shapeNow = buildShape(SHAPES.koule.f);
let minYFrom = shapeNow.minY, minYTo = shapeNow.minY;
attrA.array.set(shapeNow.pos); attrNA.array.set(shapeNow.nor);
attrB.array.set(shapeNow.pos); attrNB.array.set(shapeNow.nor);
attrTA.array.set(shapeNow.tag); attrTB.array.set(shapeNow.tag);
geo.computeBoundingSphere();

let morphing = false, morphT = 1;
function setShape(name) {
  // aktuální (i rozmorfovaný) stav zapíšeme jako výchozí A, nový tvar jde do B
  const m = U.uMorph.value;
  if (m > 0) {
    for (let i = 0; i < NV * 3; i++) {
      attrA.array[i] = attrA.array[i] * (1 - m) + attrB.array[i] * m;
      attrNA.array[i] = attrNA.array[i] * (1 - m) + attrNB.array[i] * m;
      attrTA.array[i] = attrTA.array[i] * (1 - m) + attrTB.array[i] * m;
    }
    minYFrom = minYFrom * (1 - m) + minYTo * m;
  } else { minYFrom = minYTo; }
  const nxt = buildShape(SHAPES[name].f);
  attrB.array.set(nxt.pos); attrNB.array.set(nxt.nor); attrTB.array.set(nxt.tag); minYTo = nxt.minY;
  attrA.needsUpdate = attrNA.needsUpdate = attrB.needsUpdate = attrNB.needsUpdate = attrTA.needsUpdate = attrTB.needsUpdate = true;
  U.uMorph.value = 0; morphT = 0; morphing = true;
}
function finishMorph() {
  attrA.array.set(attrB.array); attrNA.array.set(attrNB.array); attrTA.array.set(attrTB.array);
  attrA.needsUpdate = attrNA.needsUpdate = attrTA.needsUpdate = true;
  U.uMorph.value = 0; minYFrom = minYTo; morphing = false;
  geo.computeBoundingSphere();
}

const lum = (hex) => { const c = new THREE.Color(hex); return 0.2126*c.r + 0.7152*c.g + 0.0722*c.b; };
const FINISH = {
  plast:  { roughness:0.22, metalness:0,   clearcoat:1,   clearcoatRoughness:0.04, iridescence:0, sheen:0 },
  mat:    { roughness:0.78, metalness:0,   clearcoat:0,   clearcoatRoughness:0.5,  iridescence:0, sheen:0 },

let lastFinish = null;
function layoutEyes() {
  const n = S.eyes, R = S.eyeSize * (n <= 2 ? 1 : n <= 4 ? 0.8 : 0.62);
  const rows = n <= 2 ? [n] : [Math.floor(n / 2), Math.ceil(n / 2)];

/* =====================================================================
   ZVUKY — vše syntetizované přes Web Audio, žádné soubory
   ===================================================================== */
const sfx = (() => {
  let ac = null, out = null, noise = null, rub = null;
  const ctx = () => {
    if (!S.sound) return null;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
      const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      out = ac.createGain(); out.gain.value = 0.6; out.connect(comp);
      noise = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  const env = (g, t, peak, a, r) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + r); };

  function squish(amt = 1) {
    const a = ctx(); if (!a) return; const t = a.currentTime;
    const n = a.createBufferSource(); n.buffer = noise;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 5;
    bp.frequency.setValueAtTime(1800, t); bp.frequency.exponentialRampToValueAtTime(260, t + 0.16);
    const ng = a.createGain(); env(ng, t, 0.55 * amt, 0.008, 0.17);
    n.connect(bp).connect(ng).connect(out); n.start(t); n.stop(t + 0.2);
    const o = a.createOscillator(); o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.13);
    const og = a.createGain(); env(og, t, 0.4 * amt, 0.006, 0.14);
    o.connect(og).connect(out); o.start(t); o.stop(t + 0.16);
  }
  // boing při puštění — výška a délka podle toho, jak moc bylo natažené
  function boing(amt) {
    const a = ctx(); if (!a || amt < 0.04) return; const t = a.currentTime, len = 0.35 + 0.5 * amt;
    const o = a.createOscillator(); o.type = 'sine';
    const f0 = 110 + 90 * amt;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * (1.8 + amt), t + 0.04);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.9, t + len);
    const lfo = a.createOscillator(); lfo.frequency.value = 9 + 5 * amt;
    const lg = a.createGain(); lg.gain.setValueAtTime(f0 * 0.35, t); lg.gain.exponentialRampToValueAtTime(1, t + len);
    lfo.connect(lg).connect(o.frequency);
    const g = a.createGain(); env(g, t, 0.45 * Math.max(0.35, amt), 0.008, len);
    o.connect(g).connect(out); o.start(t); lfo.start(t); o.stop(t + len + 0.05); lfo.stop(t + len + 0.05);
    squish(0.35 * amt);
  }
  // pop při změně tvaru
  function pop() {
    const a = ctx(); if (!a) return; const t = a.currentTime;
    const o = a.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.07);
    const g = a.createGain(); env(g, t, 0.22, 0.005, 0.1);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.12);
  }
  // gumové vrzání během tahu — hraje jen při pohybu, výška roste s natažením
  function stretch(active, len, speed) {
    if (!ac || (!active && !rub)) return;
    if (active && !rub && S.sound) {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 9;
      const g = ac.createGain(); g.gain.value = 0;
      o.connect(lp).connect(g).connect(out); o.start();
      rub = { o, lp, g };
    }
    if (!rub) return;
    const t = ac.currentTime, on = active && S.sound;
    const vol = on ? Math.min(0.09, Math.max(0, speed - 0.15) * 0.03) : 0;
    rub.g.gain.setTargetAtTime(vol, t, 0.04);
    rub.o.frequency.setTargetAtTime(70 + len * 90, t, 0.05);
    rub.lp.frequency.setTargetAtTime(400 + len * 700, t, 0.05);

  }
  // --- hlasy zvířátek: měkké „kreslené“ tóny (sinus / trojúhelník), bez šumu a chrapotu,
  //     aby to dítě nevylekalo. voice() vrací délku v sekundách (kvůli otevřené puse). ---
  const VOICE = 0.5;                              // celková hlasitost hlasů
  function meow(a, dest, t, p) {                  // koťátko „mňau“: tón nahoru a zpátky, filtr otvírá „m“ → „ňau“
    const len = 0.5;
    const o = a.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(620 * p, t); o.frequency.exponentialRampToValueAtTime(980 * p, t + 0.16);

  }
  function yip(a, dest, t, p) {                   // štěňátko „haf“: krátký sinus, rychle nahoru a dolů
    const len = 0.14;

    o.frequency.setValueAtTime(520 * p, t); o.frequency.exponentialRampToValueAtTime(780 * p, t + 0.025);

    const h = a.createOscillator(); h.type = 'triangle';           // tichý alikvót o oktávu výš dodá „barvu“
    const g2 = a.createGain(); g2.gain.value = 0.25;
    h.frequency.setValueAtTime(1040 * p, t); h.frequency.exponentialRampToValueAtTime(1560 * p, t + 0.025);
    h.frequency.exponentialRampToValueAtTime(760 * p, t + len);

  }

    const len = 0.32;
    const o = a.createOscillator(); o.type = 'triangle';

    o.frequency.exponentialRampToValueAtTime(f0 * 0.94 * p, t + len);

    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(VOICE * 0.6, t + 0.04);

  }

})();

  const prev = S[key];

  if (key === 'color') {                                     // obličej si hlídá kontrast

  }
  if (key === 'puff' && S.shape === 'vlastni') setShape('vlastni');   // nafouknutí = nová geometrie kresby
  if (key === 'shape') {
    setShape(val);

    if (p) { Object.assign(S, p); if (p.color) S.faceColor = lum(S.color) > 0.45 ? '#0a0a0c' : '#ffffff'; syncAll(); }
    else if (prev === 'vlastni') { S.faceX = S.faceY = 0; syncAll(); }   // obličej posunutý ke „hlavě“ kresby patří jen jí

canvas.addEventListener('pointerdown', e => {

/* =====================================================================
   KRESLENÍ VLASTNÍHO TVARU
   Tahy (tažením i klikáním bodů) → obrázek kresby → vyplněná plocha → pro každý úhel
   nejvzdálenější bod plochy → nafouknutý „polštářek“. Přes obrázek se zacelí i mezery mezi tahy.

const drawEl = document.getElementById('draw'), dc = document.getElementById('dc'), dg = dc.getContext('2d');
const dMsg = document.getElementById('dMsg'), DMSG = dMsg.textContent, $d = id => document.getElementById(id);
let drawing = false, strokes = [], cur = null, faceAt = null, faceTool = false, hover = null;

const say = (t, bad = false) => { dMsg.textContent = t; dMsg.classList.toggle('bad', bad); };
const setFaceTool = on => { faceTool = on; $d('dFace').classList.toggle('on', on); dc.style.cursor = on ? 'cell' : 'crosshair'; };
function openDraw() {
  drawing = true; drawEl.hidden = false; strokes = []; cur = null; faceAt = null; hover = null; setFaceTool(false); say(DMSG);
  const r = drawEl.getBoundingClientRect(), dpr = Math.min(devicePixelRatio, 2);
  dc.width = r.width * dpr; dc.height = r.height * dpr; dc.style.width = r.width + 'px'; dc.style.height = r.height + 'px';
  dg.setTransform(dpr, 0, 0, dpr, 0, 0); paint();
}
function closeDraw() { drawing = false; drawEl.hidden = true; cur = null; }
function drawUndo() {
  const last = strokes[strokes.length - 1];
  if (last && last.clicks && last.pts.length > 1) last.pts.pop();      // u klikání ubírej po bodech
  else if (last) strokes.pop();

  say(DMSG); paint();
}
$d('dUndo').onclick = drawUndo;
$d('dClear').onclick = () => { strokes = []; faceAt = null; say(DMSG); paint(); };
$d('dFace').onclick = () => setFaceTool(!faceTool);

function paint() {
  const W = dc.clientWidth, H = dc.clientHeight, ink = getComputedStyle(document.documentElement).getPropertyValue('--accent');
  dg.clearRect(0, 0, W, H);
  dg.lineWidth = 5; dg.lineCap = dg.lineJoin = 'round'; dg.strokeStyle = dg.fillStyle = ink;
  for (const st of strokes) {
    dg.beginPath(); dg.moveTo(...st.pts[0]); for (const p of st.pts) dg.lineTo(...p); dg.stroke();
    if (st.clicks) for (const p of st.pts) { dg.beginPath(); dg.arc(p[0], p[1], 5, 0, Math.PI * 2); dg.fill(); }
  }
  const last = strokes[strokes.length - 1];
  if (last && last.clicks && hover && !faceTool) {                     // náhled další čáry při klikání
    const q = last.pts[last.pts.length - 1];
    dg.save(); dg.setLineDash([6, 8]); dg.lineWidth = 2; dg.beginPath(); dg.moveTo(...q); dg.lineTo(...hover); dg.stroke(); dg.restore();
  }
  if (faceAt) {                                                         // smajlík na místě obličeje
    const [x, y] = faceAt; dg.save(); dg.lineWidth = 2.5; dg.strokeStyle = dg.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink');
    dg.beginPath(); dg.arc(x, y, 15, 0, Math.PI * 2); dg.stroke();
    for (const sx of [-5, 5]) { dg.beginPath(); dg.arc(x + sx, y - 4, 2.2, 0, Math.PI * 2); dg.fill(); }
    dg.beginPath(); dg.arc(x, y + 1, 7, 0.2 * Math.PI, 0.8 * Math.PI); dg.stroke(); dg.restore();
  }
  $d('dDone').disabled = !strokes.length;
  $d('dUndo').disabled = !strokes.length && !faceAt;
}

const pos = e => { const r = dc.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
dc.addEventListener('pointerdown', e => {
  const p = pos(e);
  if (faceTool) { faceAt = p; setFaceTool(false); paint(); return; }
  cur = { pts:[p], moved:false };
  try { dc.setPointerCapture(e.pointerId); } catch {}
});
dc.addEventListener('pointermove', e => {
  const p = pos(e);
  if (!cur) { hover = p; const l = strokes[strokes.length - 1]; if (l && l.clicks) paint(); return; }
  const q = cur.pts[cur.pts.length - 1];
  if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 2) return;
  cur.pts.push(p);
  if (!cur.moved && Math.hypot(p[0] - cur.pts[0][0], p[1] - cur.pts[0][1]) > 4) { cur.moved = true; strokes.push(cur); }
  if (cur.moved) paint();
});
dc.addEventListener('pointerup', () => {
  if (!cur) return;
  if (!cur.moved) {                                                     // klik = další bod lomené čáry
    const last = strokes[strokes.length - 1], p = cur.pts[0];
    if (last && last.clicks) last.pts.push(p); else strokes.push({ pts:[p], clicks:true });
  }
  cur = null; say(DMSG); paint();
});
dc.addEventListener('pointerleave', () => { hover = null; if (!cur) paint(); });

function drawDone() {
  if (!strokes.length) return;
  const res = shapeFromStrokes(strokes, faceAt);
  if (!res) { say('Obrys není uzavřený nebo je moc malý — dotáhni čáru k začátku, nebo nakresli větší tvar', true); return; }
  SHAPES.vlastni.f = res.f;
  SHAPES.vlastni.preset = { faceX:res.faceX, faceY:res.faceY };
  $d('chipMine').hidden = false;
  closeDraw(); change('shape', 'vlastni');
}

function shapeFromStrokes(list, face) {
  const W = dc.clientWidth, H = dc.clientHeight, k = 320 / Math.max(W, H);
  const gw = Math.ceil(W * k), gh = Math.ceil(H * k), N = gw * gh;
  const oc = document.createElement('canvas'); oc.width = gw; oc.height = gh;
  const g = oc.getContext('2d', { willReadFrequently:true });
  // jediný tah, který končí blízko svého začátku, se uzavře; lomená čára z klikání vždy.
  // (u víc tahů ne — jinak by se třeba samostatně nakreslený ocas uzavřel do vlastního tvaru)
  const single = list.length === 1;
  const paths = list.map(st => {
    const P = st.pts; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of P) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const gap = Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]);
    return { P, closed: st.clicks ? P.length >= 3 : single && gap < 0.45 * Math.hypot(x1 - x0, y1 - y0) };
  });
  // mosty: konec tahu se spojí s nejbližším koncem jiného tahu, pokud je blízko
  const ends = []; paths.forEach(({ P, closed }, i) => { if (!closed) ends.push([P[0], i], [P[P.length - 1], i]); });
  const bridges = [], near = 0.1 * Math.max(W, H);
  for (const [p, i] of ends) {
    let best = null, bd = near;
    for (const [q, j] of ends) { if (j === i) continue; const d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (d < bd) { bd = d; best = q; } }
    if (best) bridges.push([p, best]);
  }
  let bestRes = null, bestHoles = 300;
  for (const lw of [4, 10, 19]) {                    // čím dál silnější čára zacelí i zbylé mezery
    g.clearRect(0, 0, gw, gh); g.lineWidth = lw; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = '#000';
    for (const { P, closed } of paths) {
      g.beginPath();
      if (P.length === 1) { g.arc(P[0][0] * k, P[0][1] * k, lw / 2, 0, Math.PI * 2); g.fill(); continue; }
      g.moveTo(P[0][0] * k, P[0][1] * k); for (const [x, y] of P) g.lineTo(x * k, y * k);
      if (closed) g.closePath(); g.stroke();
    }
    for (const [p, q] of bridges) { g.beginPath(); g.moveTo(p[0] * k, p[1] * k); g.lineTo(q[0] * k, q[1] * k); g.stroke(); }
    const px = g.getImageData(0, 0, gw, gh).data, ink = new Uint8Array(N);
    for (let i = 0; i < N; i++) ink[i] = px[i * 4 + 3] > 100;
    // vnějšek = záplava od okrajů přes nepokreslené pixely; vše ostatní je tvar
    const ext = new Uint8Array(N), q = new Int32Array(N); let qh = 0, qt = 0;
    const seed = i => { if (!ink[i] && !ext[i]) { ext[i] = 1; q[qt++] = i; } };
    for (let x = 0; x < gw; x++) { seed(x); seed((gh - 1) * gw + x); }
    for (let y = 0; y < gh; y++) { seed(y * gw); seed(y * gw + gw - 1); }
    while (qh < qt) {
      const i = q[qh++], x = i % gw;
      if (x > 0) seed(i - 1); if (x < gw - 1) seed(i + 1); if (i >= gw) seed(i - gw); if (i < N - gw) seed(i + gw);
    }
    let holes = 0; for (let i = 0; i < N; i++) if (!ext[i] && !ink[i]) holes++;

  }
  return bestRes && radialShape(bestRes, gw, gh, face && [face[0] * k, face[1] * k]);
}

function radialShape(ext, gw, gh, face) {
  const N = gw * gh;
  // vzdálenost od okraje (chamfer 3-4, skoro eukleidovská) → nejhlubší bod = střed; slouží i k nafouknutí
  const dist = new Float32Array(N);
  for (let i = 0; i < N; i++) dist[i] = ext[i] ? 0 : 1e9;
  const relax = (i, j, w) => { if (dist[j] + w < dist[i]) dist[i] = dist[j] + w; };
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = y * gw + x; if (!dist[i]) continue;
    if (x > 0) relax(i, i - 1, 3); if (y > 0) { relax(i, i - gw, 3); if (x > 0) relax(i, i - gw - 1, 4); if (x < gw - 1) relax(i, i - gw + 1, 4); }
  }
  for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--) {
    const i = y * gw + x; if (!dist[i]) continue;
    if (x < gw - 1) relax(i, i + 1, 3); if (y < gh - 1) { relax(i, i + gw, 3); if (x < gw - 1) relax(i, i + gw + 1, 4); if (x > 0) relax(i, i + gw - 1, 4); }
  }
  for (let pass = 0; pass < 3; pass++) for (const step of [1, gw]) {     // rozmazat, ať je nafouknutí oblé
    const c = dist.slice();
    for (let i = 0; i < N; i++) if (!ext[i]) { let sum = 0, n = 0; for (let o = -3; o <= 3; o++) { const j = i + o * step; if (j >= 0 && j < N) { sum += c[j]; n++; } } dist[i] = sum / n; }
  }
  let cx = gw / 2, cy = gh / 2, best = -1;
  for (let i = 0; i < N; i++) if (dist[i] > best) { best = dist[i]; cx = i % gw; cy = (i / gw) | 0; }
  const sampleDist = (gx, gy) => {                                      // bilineárně z mřížky
    const x0 = Math.max(0, Math.min(gw - 2, Math.floor(gx))), y0 = Math.max(0, Math.min(gh - 2, Math.floor(gy)));
    const tx = Math.max(0, Math.min(1, gx - x0)), ty = Math.max(0, Math.min(1, gy - y0)), i = y0 * gw + x0;
    return (dist[i] * (1 - tx) + dist[i + 1] * tx) * (1 - ty) + (dist[i + gw] * (1 - tx) + dist[i + gw + 1] * tx) * ty;
  };
  // pro každý úhel nejvzdálenější bod tvaru (úhel měřen s osou y nahoru)
  const B = 360, tab = new Float32Array(B), maxR = Math.hypot(gw, gh);
  for (let b = 0; b < B; b++) {
    const a = (b + 0.5) / B * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a); let last = 0;
    for (let r = 0; r < maxR; r += 0.25) {
      const x = Math.round(cx + ca * r), y = Math.round(cy - sa * r);
      if (x < 0 || y < 0 || x >= gw || y >= gh) break;
      if (!ext[y * gw + x]) last = r;
    }
    tab[b] = last;
  }
  for (let pass = 0; pass < 6; pass++) {                              // vyhlazení třesu ruky i schodů z mřížky
    const c = tab.slice();
    for (let i = 0; i < B; i++) tab[i] = (c[(i + B - 2) % B] + c[(i + B - 1) % B] + c[i] + c[(i + 1) % B] + c[(i + 2) % B]) / 5;
  }
  let m = 0, bMax = 0; for (let i = 0; i < B; i++) if (tab[i] > m) { m = tab[i]; bMax = i; }
  const sc = 1.1 / m; for (let i = 0; i < B; i++) tab[i] *= sc;
  const dMax = best / 3 * sc;
  const Rr = (phi) => {
    const a = (phi < 0 ? phi + Math.PI * 2 : phi) / (Math.PI * 2) * B - 0.5, i = Math.floor(a), t = a - i;
    return tab[(i + B) % B] * (1 - t) + tab[(i + 1 + B) % B] * t;
  };
  // obličej: kam ho dítě kliklo; jinak posunutý od středu ke „hlavě“ = proti nejdelšímu výběžku
  // (u rybičky proti ocasu), jen vodorovně a tím víc, čím je tvar nesouměrnější
  let tx, ty;
  if (face) { tx = (face[0] - cx) * sc; ty = -(face[1] - cy) * sc; }
  else {
    const aMax = (bMax + 0.5) / B * Math.PI * 2, rOpp = tab[(bMax + B / 2) % B];
    const shift = Math.max(0, (1.1 - rOpp) / 1.1) * rOpp * 0.9;
    tx = -Math.sign(Math.cos(aMax)) * shift * Math.abs(Math.cos(aMax)); ty = 0;
  }
  const rt = Rr(Math.atan2(ty, tx)) || 1;
  let dx = tx / rt, dy = ty / rt; const l = Math.hypot(dx, dy); if (l > 0.8) { dx *= 0.8 / l; dy *= 0.8 / l; }
  const fx = Math.asin(dx), fy = Math.asin(Math.max(-1, Math.min(1, dy / Math.cos(fx))));
  return {
    // nafukovací hračka: tloušťka podle vzdálenosti od okraje kresby (kruh → koule), takže
    // tělo je buclaté a tenké části (ocas, ploutve) zůstanou tenčí; S.puff = síla nafouknutí
    f: (x, y, z) => {
      const r = Rr(Math.atan2(y, x)), px = x * r, py = y * r;
      const gx = cx + px / sc, gy = cy - py / sc, d = sampleDist(gx, gy) / 3 * sc;    // vzdálenost v jednotkách tvaru
      // spodní mez = jemný polštářek (spojitý v každém směru); v tenkých cípech převáží on a nevzniknou „hřebínky“
      const h = Math.max(0.24 * Math.abs(z), Math.sqrt(Math.max(0, d * (2 * dMax - d))));
      const rim = Math.min(1, Math.abs(z) / 0.2);                       // na obrysu musí tloušťka klesnout k nule
      return [px, py, Math.sign(z) * S.puff * h * rim * (2 - rim)];
    },
    faceX: Math.max(-0.9, Math.min(0.9, fx)), faceY: Math.max(-0.7, Math.min(0.7, fy)),
  };
}

let tap = null;

canvas.addEventListener('pointerup', e => {
  if (!tap || Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 6 || performance.now() - tap.t > 350) return;
  setNdc(e); ball.updateMatrixWorld(); ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(ball).length) speak();
});

const look = new THREE.Vector2(), lookT = new THREE.Vector2();
addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  lookT.set(THREE.MathUtils.clamp(((e.clientX - r.left)/r.width)*2 - 1, -1.3, 1.3), THREE.MathUtils.clamp(-(((e.clientY - r.top)/r.height)*2 - 1), -1.3, 1.3));
});

/* =====================================================================
   SMYČKA
   ===================================================================== */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 32 / Math.max(0.55, w / h) : 32;   // úzká obrazovka: oddálit
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

const tmpE = new THREE.Euler(), tmpM4 = new THREE.Matrix4();
let last = performance.now(), T = 0, nextBlink = 2, blinkAt = -1;
const animMul = new THREE.Vector3(1, 1, 1), offW = new THREE.Vector3();

renderer.setAnimationLoop(now => {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt;

  // morf tvaru
  if (morphing) { morphT = Math.min(1, morphT + dt / 0.55); const e = morphT < 0.5 ? 2*morphT*morphT : 1 - Math.pow(-2*morphT + 2, 2) / 2; U.uMorph.value = e; if (morphT >= 1) finishMorph(); }
  const minY = minYFrom * (1 - U.uMorph.value) + minYTo * U.uMorph.value;

  // animace tělesa
  let mx = 1, my = 1, mz = 1, jump = 0;
  const talking = T < talkUntil, an = SHAPES[S.shape].animal || 0;
  if (talking) { const k = Math.sin((talkUntil - T) * 24); my *= 1 + 0.035 * k; mx *= 1 - 0.018 * k; mz *= 1 - 0.018 * k; }
  U.uMouthStyle.value = talking && S.mouth > 0 ? (an === 2 ? 2 : 4) : S.mouth;   // při hlasu otevřená pusa
  if (S.breathe) { const b = Math.sin(T * 2.1); my *= 1 + 0.025 * b; mx *= 1 - 0.012 * b; mz *= 1 - 0.012 * b; }
  if (S.bounce) {
    const p = Math.abs(Math.sin(T * 2.8)); jump = p * 0.75;
    const sq = Math.pow(1 - p, 10); my *= 1 + 0.1 * p - 0.2 * sq; mx *= 1 - 0.04 * p + 0.1 * sq; mz *= 1 - 0.04 * p + 0.1 * sq;
  }
  animMul.set(mx, my, mz);
  userScale.lerp(userTarget, 1 - Math.pow(0.0005, dt));
  ball.scale.copy(userScale).multiply(animMul);
  ball.rotation.z = THREE.MathUtils.lerp(ball.rotation.z, S.sway ? 0.14 * Math.sin(T * 2.2) : 0, 0.15);
  ball.position.y = GROUND - minY * ball.scale.y + jump;
  shadow.scale.set(2.4 * ball.scale.x * (1 - jump * 0.2), 2.4 * ball.scale.z * (1 - jump * 0.2), 1);
  shadow.material.opacity = 1 / (1 + jump * 1.6);

  // mrkání a sledování myši
  if (S.blink && T > nextBlink && blinkAt < 0) { blinkAt = T; nextBlink = T + 2.2 + Math.random() * 3.5; if (Math.random() < 0.2) nextBlink = T + 0.35; }
  let bl = 0; if (blinkAt >= 0) { const u = (T - blinkAt) / 0.18; if (u >= 1) blinkAt = -1; else bl = 1 - Math.abs(2 * u - 1); }
  U.uBlink.value = S.blink ? bl : 0;
  look.lerp(S.track ? lookT : new THREE.Vector2(), 1 - Math.pow(0.002, dt));
  U.uLook.value.copy(look).clampLength(0, 1);
  const tk = S.track ? (SHAPES[S.shape].animal || SHAPES[S.shape].custom ? 0.3 : 1) : 0;   // zvířátka: obličej nesmí ujet z čumáku; plochá kresba: ani z těla
  tmpE.set(-(S.faceY + look.y * 0.3 * tk), S.faceX + look.x * 0.4 * tk, 0);
  tmpM4.makeRotationFromEuler(tmpE).invert(); U.uFaceRot.value.setFromMatrix4(tmpM4);

  // pružina natahování
  const k = grabbed ? 220 : 90, damp = grabbed ? 0.82 : 0.9;
  vel.addScaledVector(want.clone().sub(off), k * dt); vel.multiplyScalar(damp); off.addScaledVector(vel, dt * 6);
  U.uOff.value.copy(off);
  sfx.stretch(grabbed, off.length(), vel.length());

  // stín jde za nataženou částí: posun + protažení, tah dolů ho ztmaví
  offW.copy(off).multiply(ball.scale).multiplyScalar(0.35);
  shadow.position.set(offW.x, GROUND + 0.004, offW.z);
  shadow.scale.x += Math.abs(offW.x) * 1.6;
  shadow.scale.y += Math.abs(offW.z) * 1.6;
  shadow.material.opacity *= THREE.MathUtils.clamp(1 - offW.y * 0.9, 0.35, 1.5);

  controls.update();
  renderer.render(scene, camera);
});

syncAll(); apply();
</script>
</body>
